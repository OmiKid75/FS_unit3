services:
  stable:
    build: .
    image: ${DOCKERHUB_USERNAME:-local}/ci-cd-demo:stable
    environment:
      APP_VERSION: "1.0.0"
      RELEASE_TRACK: "stable"
    ports:
      - "8080:8080"

  canary:
    build: .
    image: ${DOCKERHUB_USERNAME:-local}/ci-cd-demo:canary
    environment:
      APP_VERSION: "1.1.0"
      RELEASE_TRACK: "canary"
    ports:
      - "8081:8080"
    profiles:
      - canary
